  - _5e0c1b8d   # blk: 2 lan, ban tay giu _5d690575 (9 lan)
  - _0dc41cf2   # dlg: 13 lan, ban tay giu _a72a3dce (50 lan)
   # grp: tenauto doan kieu, _d533ec26 dung 144 lan
  - _3cc0311c   # num: tenauto doan kieu, _5e86883a la mot method
  - _538a3d28   # pname: 6 lan, cay sinh doi cung goi _2bcd29a8 (27 lan) la pname
  - _43ae5f3d   # rows: _62ef82e9 co 5 lan tu soi guong, cai nay khong co
  - _081c2f3e   # section: 22 lan, cay sinh doi cung goi _f86dea4f (40 lan) la section
  - _79f8d55d   # sel: 3 lan, ban tay giu _7e48d1c7 (123 lan)

  # --- Dot hai: xung dot PHAM VI. Moi hex duoi day co bang chung ten that,
  # nhung trong mot than ham nao do no dung do voi mot hex khac cung ten,
  # hoac voi mot dinh danh chua bi lam roi. Gop lai la mat mot thu. Chung
  # cho dot dat ten THEO PHAM VI; tu gio den do cu de nguyen hex.
  - _d8a5a5cb
  # Ban sinh doi ZSU goi hex nay la `arr`. Ben nay no la thu khac va doc theo
  # ngu canh thi ro hon. (_6e6c93db va _9535dc0b da co ten that: xem tren.)
  # `pts` -- o loop.rb la mot doan hai diem, o scan.rb la duong vien chu. Hai
  # nghia khac nhau, lai dung do voi bien `pts` con sot lai trong cung than ham.
  # `num3` -- mot cai la khoang dem doc, mot cai la kenh mau da lam nhat.
