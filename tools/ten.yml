  # --- Dot ba: tu ma MOT ben tay va MOT ben cay sinh doi cung nhan.
  # Khong ben nao tu soi guong trong chuoi con sot, nen phan cho hex
  # duoc dung nhieu hon. Ben thua o day la de xuat tu cay sinh doi;
