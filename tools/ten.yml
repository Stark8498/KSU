  # Two read wrong against their own bodies:
  _452810e1: write_staged
  # writes the staged files out; the word belongs to other.rb's, which
  # is a wrapper over Sketchup's own commit_operation. `staged` is the
  # author's key here
  _607c5494: resolved_layer
